services:
  db:
    image: postgres:16
    container_name: tickertrack-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: tickertrack_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - tickertrack-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d tickertrack_dev"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tickertrack-api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/tickertrack_dev
      REPORT_DIR: /app/reports

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - tickertrack-reports:/app/reports


volumes:
  tickertrack-db-data:
  tickertrack-reports: